name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: file:./test.db

      - name: Test
        run: pnpm test

  notify-failure:
    needs: [build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Discord error channel
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ERROR_CHANNEL_ID: ${{ secrets.ERROR_CHANNEL_ID }}
        run: |
          sh scripts/notify-discord-channel.sh "Grimkeeper CI failed" "failure" \
            "workflow: CI" \
            "ref: ${{ github.ref }}" \
            "sha: ${{ github.sha }}" \
            "actor: ${{ github.actor }}" \
            "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
