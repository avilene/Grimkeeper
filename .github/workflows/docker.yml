name: Docker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      deploy-hook: ${{ steps.filter.outputs.deploy-hook }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'apps/admin/**'
              - 'packages/database/**'
              - 'packages/engine/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'ops/docker.npmrc'
              - 'scripts/admin-entrypoint.sh'
            deploy-hook:
              - 'ops/deploy-hook/**'

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Tag released source maps with the git SHA (baked into the image as SENTRY_RELEASE).
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_ORG=grimkeeper
            SENTRY_PROJECT_ADMIN=admin
          # Auth token mounts only during `next build` — never lands in image layers.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  build-and-push-deploy-hook:
    needs: changes
    if: needs.changes.outputs.deploy-hook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-deploy-hook
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ./ops/deploy-hook
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trigger-deploy:
    needs: [build-and-push, build-and-push-admin]
    # Redeploy when bot and/or admin image jobs finish (admin may be skipped).
    if: always() && needs.build-and-push.result == 'success' && (needs.build-and-push-admin.result == 'success' || needs.build-and-push-admin.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger droplet redeploy
        id: deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "Deploy webhook not configured; skipping."
            exit 0
          fi
          body=$(printf '{"event":"docker-push","ref":"refs/heads/main","sha":"%s"}' "${{ github.sha }}")
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | awk '{print $2}')
          response="$(curl -sS -w "\n__HTTP_CODE__:%{http_code}" -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$body")"
          http_code="$(printf '%s' "$response" | sed -n 's/^__HTTP_CODE__://p' | tail -1)"
          response_body="$(printf '%s' "$response" | sed '/^__HTTP_CODE__:/d')"
          echo "Deploy webhook HTTP ${http_code}"
          if [ -n "$response_body" ]; then
            echo "Deploy webhook response:"
            printf '%s\n' "$response_body"
          fi
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ] \
            && ! printf '%s' "$response_body" | grep -qiE 'error|failed|exit status'; then
            echo "Deploy webhook succeeded."
          else
            echo "Deploy webhook failed."
            echo "deploy_failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify manual redeploy
        if: steps.deploy.outputs.deploy_failed == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ERROR_CHANNEL_ID: ${{ secrets.ERROR_CHANNEL_ID }}
        run: |
          sh scripts/notify-discord-channel.sh "Grimkeeper auto-deploy failed — redeploy manually" "failure" \
            "workflow: Docker" \
            "image: ghcr.io/${{ github.repository }}:latest" \
            "sha: ${{ github.sha }}" \
            "action: SSH to droplet and run pnpm docker:redeploy" \
            "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  notify-failure:
    needs: [changes, build-and-push, build-and-push-admin, build-and-push-deploy-hook, trigger-deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Discord error channel
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ERROR_CHANNEL_ID: ${{ secrets.ERROR_CHANNEL_ID }}
        run: |
          sh scripts/notify-discord-channel.sh "Grimkeeper Docker workflow failed" "failure" \
            "workflow: Docker" \
            "ref: ${{ github.ref }}" \
            "sha: ${{ github.sha }}" \
            "actor: ${{ github.actor }}" \
            "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
