services:
  bot:
    image: ${GRIMKEEPER_IMAGE:-grimkeeper-bot:local}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/grimkeeper.db
      DEV_MODE: ${DEV_MODE:-false}
      BOT_MODE: ${BOT_MODE:-full}
      DEPLOY_TRIGGER: ${DEPLOY_TRIGGER:-unknown}
    volumes:
      - grimkeeper-data:/app/data

  # Optional — enable with: docker compose --profile logging up -d
  promtail:
    profiles: ["logging"]
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml -config.expand-env=true
    environment:
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USERNAME: ${GRAFANA_CLOUD_LOKI_USERNAME:-}
      GRAFANA_CLOUD_LOKI_API_KEY: ${GRAFANA_CLOUD_LOKI_API_KEY:-}
      HOSTNAME: ${HOSTNAME:-grimkeeper-droplet}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    labels:
      logging: "promtail"
      logging_jobname: "grimkeeper-bot"

  # Optional — poll GHCR for new :latest digest and auto-redeploy:
  #   docker compose --profile deploy up -d watcher
  watcher:
    profiles: ["deploy"]
    image: docker:27-cli
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IMAGE_WATCH_INTERVAL: ${IMAGE_WATCH_INTERVAL:-300}
      AUTO_REDEPLOY: ${AUTO_REDEPLOY:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app:ro
      - grimkeeper-deploy:/app/.deploy
    working_dir: /app
    entrypoint: ["/bin/sh", "scripts/watch-image.sh"]

volumes:
  grimkeeper-data:
  grimkeeper-deploy:
