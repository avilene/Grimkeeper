services:
  # Keep exactly one bot container. Discord delivers every interaction to every
  # process sharing DISCORD_TOKEN — scale>1 or a lingering second instance causes
  # fast 10062 ack races. `docker compose up -d --scale bot=N` must stay at N=1.
  bot:
    image: ${GRIMKEEPER_IMAGE:-grimkeeper-bot:local}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/grimkeeper.db
      DEV_MODE: ${DEV_MODE:-false}
      DEPLOY_TRIGGER: ${DEPLOY_TRIGGER:-unknown}
    volumes:
      - grimkeeper-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional — enable with COMPOSE_PROFILES=admin (or --profile admin).
  # Shares the bot SQLite volume. Discord OAuth for sign-in; ADMIN_IDS for full admin.
  # See apps/admin/README.md (Production).
  admin:
    profiles: ["admin"]
    image: ${ADMIN_IMAGE:-grimkeeper-admin:local}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      - bot
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/grimkeeper.db
      # Container always listens on 3847; map a host port via ADMIN_HOST_PORT.
      ADMIN_PORT: "3847"
      ADMIN_HOSTNAME: "0.0.0.0"
      AUTH_TRUST_HOST: "true"
      # Public site URL for Auth.js (derived from ADMIN_OAUTH_CALLBACK_URL in entrypoint if unset).
      AUTH_URL: ${AUTH_URL:-}
      ADMIN_OAUTH_CALLBACK_URL: ${ADMIN_OAUTH_CALLBACK_URL:-}
      # Prefer ADMIN_SENTRY_DSN (admin project). Do not point this at the bot DSN.
      ADMIN_SENTRY_DSN: ${ADMIN_SENTRY_DSN:-}
      # Release is baked into the admin image at build time (CI git sha). Do not override here.
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Bot token — used for Discord channel-name and member display-name lookups.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      # Comma-separated Discord user IDs with full admin access.
      ADMIN_IDS: ${ADMIN_IDS:-}
      NODE_ENV: production
    volumes:
      - grimkeeper-data:/app/data
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_HOST_PORT:-3847}:3847"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional HTTPS front for admin — enable with COMPOSE_PROFILES=admin,proxy
  # (or --profile proxy). Needs ADMIN_DOMAIN + A/AAAA → this host. Proxies to
  # admin:3847 on the compose network. Open firewall ports 80 and 443.
  caddy:
    profiles: ["proxy"]
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - admin
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional — enable with: docker compose --profile logging up -d
  promtail:
    profiles: ["logging"]
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml -config.expand-env=true
    environment:
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USERNAME: ${GRAFANA_CLOUD_LOKI_USERNAME:-}
      GRAFANA_CLOUD_LOKI_API_KEY: ${GRAFANA_CLOUD_LOKI_API_KEY:-}
      HOSTNAME: ${HOSTNAME:-grimkeeper-droplet}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    labels:
      logging: "promtail"
      logging_jobname: "grimkeeper-bot"

  # Optional — shared deploy webhook for Grimkeeper + Koi (same port/secret):
  #   docker compose --profile deploy up -d deploy-hook
  # Grimkeeper CI → http://DROPLET:9000/hooks/redeploy
  # Koi CI        → http://DROPLET:9000/hooks/redeploy-koi
  # Set KOI_REPO_DIR to the host path of the koi-discord checkout (sibling by default).
  deploy-hook:
    profiles: ["deploy"]
    image: ${DEPLOY_HOOK_IMAGE:-grimkeeper-deploy-hook:local}
    build: ./ops/deploy-hook
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app:ro
      - ${KOI_REPO_DIR:-../koi-discord}:/koi:ro
      # Host `docker login ghcr.io` credentials — required for private image pulls from the hook.
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/root/.docker:ro
    ports:
      - "${DEPLOY_WEBHOOK_PORT:-9000}:9000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  grimkeeper-data:
  caddy_data:
  caddy_config:
